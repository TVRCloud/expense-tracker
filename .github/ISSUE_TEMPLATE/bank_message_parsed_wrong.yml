name: Bank message parsed wrongly
description: A bank SMS or app notification was skipped, queued for review, or turned into the wrong transaction.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This form is for the capture pipeline (the phone filter, the parser and account matching).
        **Redact before you paste.** Replace names, full account or card numbers and balances with `XXXX`, and never include an OTP. Keep the wording, order and punctuation of the message exactly as it is, because that is what the parser reads.
  - type: textarea
    id: message
    attributes:
      label: The message (redacted)
      description: Paste the whole message. Keep the sender ID if you know it (for example VM-HDFCBK).
      placeholder: |
        Sender: VM-HDFCBK
        Rs.250.00 debited from A/c XX1234 on 26-09-26 to VPA swiggy@icici. UPI Ref 4269XXXXXXXX
      render: text
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: How did it reach the app?
      options:
        - SMS
        - Bank or UPI app notification
        - Both
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: What happened?
      options:
        - Nothing appeared at all (skipped on the phone)
        - It is in Review but should have been added automatically
        - It was added with the wrong amount
        - It was added as credit instead of debit (or the reverse)
        - It was added to the wrong account
        - It has the wrong merchant or description
        - It was added twice
        - A message that is not a payment was added
        - Something else
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
      description: The amount, direction (debit or credit), account and merchant you expected.
      placeholder: "Debit of 250.00 from HDFC Savings, merchant Swiggy."
    validations:
      required: true
  - type: input
    id: bank
    attributes:
      label: Bank or app
      placeholder: "HDFC Bank SMS, PhonePe notification"
  - type: textarea
    id: details
    attributes:
      label: Anything else
      description: What the app showed (for example the reason on a Review item), the app version, and whether similar messages from this bank work.
  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: I redacted names, full account or card numbers and balances, and there is no OTP in this message.
          required: true
        - label: I searched the open issues for the same bank and message format.
          required: true
